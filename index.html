
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dom Veiot Barbearia</title>
  <link rel="icon" href="https://media.base44.com/images/public/6a9b8c5c1ea53ca6ba6443ab/9e4d1bcd0_logo.png" type="image/png">
  
  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* RESET & ESTILOS BASE */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #121212;
      --bg-card: #1e1e1e;
      --bg-card-hover: #262626;
      --gold-accent: #d4af37;
      --gold-hover: #f3ce56;
      --text-main: #f5f5f5;
      --text-muted: #a0a0a0;
      --border-color: #333333;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* HEADER & LOGO */
    header {
      text-align: center;
      padding: 20px 10px;
      background: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .logo-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
    }

    h1 span {
      color: var(--gold-accent);
      display: block;
      font-size: 0.9rem;
      letter-spacing: 4px;
      margin-top: 4px;
    }

    .address {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* SEÇÃO DE SERVIÇOS */
    .services-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .services-card h3 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      text-transform: uppercase;
      color: var(--gold-accent);
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 1px;
      border-bottom: 2px solid var(--gold-accent);
      padding-bottom: 8px;
    }

    .service-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-color);
      transition: background 0.2s ease;
    }

    .service-item:last-child {
      border-bottom: none;
    }

    .service-name {
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
    }

    .service-price {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--gold-accent);
      background: rgba(212, 175, 55, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    /* BOTÃO WHATSAPP */
    .btn-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: var(--gold-accent);
      color: #000000;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      text-transform: uppercase;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
      transition: all 0.3s ease;
      margin-top: 20px;
    }

    .btn-whatsapp:hover {
      background: var(--gold-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
    }

    /* INFORMAÇÕES DE ATENDIMENTO */
    .info-footer {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 15px;
      line-height: 1.8;
    }

    .info-footer strong {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- CABEÇALHO COM LOGO -->
    <header>
      <img src="https://media.base44.com/images/public/6a9b8c5c1ea53ca6ba6443ab/9e4d1bcd0_logo.png" alt="Dom Veiot Barbearia Logo" class="logo-img">
      <h1>Dom Veiot<span>BARBEARIA</span></h1>
      <p class="address">📍 Rua Mariana, 60 - Jd. N. Sra. Aparecida - Jandira</p>
    </header>

    <!-- LISTA DE SERVIÇOS E AGENDAMENTO -->
    <main class="services-card">
      <h3>Serviços & Tabela</h3>

      <div class="service-item">
        <span class="service-name">Corte Masculino</span>
        <span class="service-price">R$ 40</span>
      </div>

      <div class="service-item">
        <span class="service-name">Barba</span>
        <span class="service-price">R$ 30</span>
      </div>

      <div class="service-item">
        <span class="service-name">Corte + Sobrancelha</span>
        <span class="service-price">R$ 50</span>
      </div>

      <div class="service-item">
        <span class="service-name">Combo Corte + Barba</span>
        <span class="service-price">R$ 60</span>
      </div>

      <!-- BOTÃO WHATSAPP -->
      <a href="https://wa.me/5511989842105?text=Quero%20agendar%20horario%20na%20Dom%20Veiot" target="_blank" class="btn-whatsapp">
        Agendar no WhatsApp
      </a>

      <!-- HORÁRIO E CONTATO -->
      <div class="info-footer">
        <p>🕒 <strong>Atendimento:</strong> Seg a Sáb - 9h às 20h</p>
        <p>📱 <strong>WhatsApp:</strong> (11) 98984-2105</p>
      </div>
    </main>

  </div>

</body>
</html>
