<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Veiot Barbearia - Agendamento</title>
    <!-- Ícone oficial do Base44 -->
    <link rel="icon" href="https://media.base44.com/images/public/6a9b8c5c1ea53ca6ba6443ab/9e4d1bcd0_logo.png" type="image/png">
    
    <!-- Fonte Montserrat (usada no Base44) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-black: #000000;
            --bg-card: #0a0a0a;
            --gold: #d4af37;
            --gold-hover: #f3ce56;
            --text-white: #ffffff;
            --text-gray: #a0a0a0;
            --border: #1a1a1a;
            --font-main: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }

        .booking-container {
            width: 100%;
            max-width: 450px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* HEADER */
        .header {
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .header img {
            width: 70px;
            height: 70px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header h1 span {
            color: var(--gold);
        }

        /* SEÇÕES DE PASSO */
        .step-title {
            font-size: 0.9rem;
            color: var(--text-gray);
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* 1. SERVIÇOS */
        .services-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .service-option {
            background-color: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .service-option:hover {
            border-color: rgba(212, 175, 55, 0.5);
            background-color: rgba(212, 175, 55, 0.05);
        }

        .service-option.selected {
            border-color: var(--gold);
            background-color: rgba(212, 175, 55, 0.1);
        }

        .service-info {
            display: flex;
            flex-direction: column;
        }

        .service-name {
            font-weight: 700;
            font-size: 1rem;
        }

        .service-duration {
            font-size: 0.8rem;
            color: var(--text-gray);
            margin-top: 3px;
        }

        .service-price {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--gold);
        }

        /* 2. DATA */
        .date-input-wrapper {
            position: relative;
        }

        input[type="date"] {
            width: 100%;
            padding: 15px;
            background-color: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-white);
            font-size: 1rem;
            appearance: none; /* Remove estilo nativo */
            -webkit-appearance: none;
            cursor: pointer;
        }
        
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1); /* Deixa o ícone do calendário branco */
            opacity: 0.7;
            cursor: pointer;
        }

        /* 3. HORÁRIOS */
        .time-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .time-option {
            background-color: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 5px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-gray);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .time-option:hover {
            border-color: rgba(212, 175, 55, 0.5);
            color: var(--text-white);
        }

        .time-option.selected {
            background-color: var(--gold);
            border-color: var(--gold);
            color: var(--bg-black);
        }

        .time-option.disabled {
            opacity: 0.2;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        /* BOTÃO WHATSAPP */
        .btn-submit {
            width: 100%;
            background-color: var(--gold);
            color: var(--bg-black);
            border: none;
            border-radius: 8px;
            padding: 18px;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--gold-hover);
        }

        .btn-submit:disabled {
            background-color: #333;
            color: #777;
            cursor: not-allowed;
        }

        /* FOOTER INFO */
        .footer-info {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-gray);
            border-top: 1px solid var(--border);
            padding-top: 15px;
            margin-top: 10px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="booking-container">
        
        <header class="header">
            <img src="https://media.base44.com/images/public/6a9b8c5c1ea53ca6ba6443ab/9e4d1bcd0_logo.png" alt="Dom Veiot Barbearia Logo">
            <h1>Dom Veiot<span> BARBERARIA</span></h1>
        </header>

        <!-- 1. ESCOLHA O SERVIÇO -->
        <section>
            <p class="step-title">1. Escolha o serviço</p>
            <div class="services-list" id="servicesList">
                <div class="service-option" data-service="Corte" data-price="40" data-duration="30min">
                    <div class="service-info">
                        <span class="service-name">Corte</span>
                        <span class="service-duration">🕒 30 min</span>
                    </div>
                    <span class="service-price">R$ 40</span>
                </div>
                <div class="service-option" data-service="Barba" data-price="30" data-duration="30min">
                    <div class="service-info">
                        <span class="service-name">Barba</span>
                        <span class="service-duration">🕒 30 min</span>
                    </div>
                    <span class="service-price">R$ 30</span>
                </div>
                <div class="service-option" data-service="Combo" data-price="60" data-duration="60min">
                    <div class="service-info">
                        <span class="service-name">Combo</span>
                        <span class="service-duration">🕒 60 min</span>
                    </div>
                    <span class="service-price">R$ 60</span>
                </div>
                <div class="service-option" data-service="Sobrancelha" data-price="15" data-duration="15min">
                    <div class="service-info">
                        <span class="service-name">Sobrancelha</span>
                        <span class="service-duration">🕒 15 min</span>
                    </div>
                    <span class="service-price">R$ 15</span>
                </div>
            </div>
        </section>

        <!-- 2. ESCOLHA A DATA -->
        <section>
            <p class="step-title">2. Escolha a data</p>
            <div class="date-input-wrapper">
                <input type="date" id="dateInput">
            </div>
        </section>

        <!-- 3. ESCOLHA O HORÁRIO -->
        <section id="timeSection" style="display: none;">
            <p class="step-title">3. Escolha o horário</p>
            <div class="time-grid" id="timeGrid">
                <!-- Horários gerados pelo JavaScript -->
            </div>
        </section>

        <!-- BOTÃO FINAL -->
        <button class="btn-submit" id="submitBtn" disabled>Agendar no WhatsApp</button>

        <!-- INFORMAÇÕES ADICIONAIS -->
        <footer class="footer-info">
            <p>📍 Rua Mariana, 60 - Sagrado Coração, Jandira - SP</p>
            <p>🕒 Seg-Sáb 9h às 20h</p>
            <p>&copy; 2026 Dom Veiot Barberaria</p>
        </footer>

    </div>

    <script>
        // Configurações
        const WHATSAPP_NUMBER = "5511989842105"; // Seu número com DDD
        const openingTime = 9; // 09:00
        const closingTime = 20; // 20:00
        const timeSlotMinutes = 30; // Intervalo de 30 min

        // Elementos
        const servicesList = document.getElementById('servicesList');
        const dateInput = document.getElementById('dateInput');
        const timeSection = document.getElementById('timeSection');
        const timeGrid = document.getElementById('timeGrid');
        const submitBtn = document.getElementById('submitBtn');

        // Estado do Agendamento
        let selectedService = null;
        let selectedDate = null;
        let selectedTime = null;

        // --- INICIALIZAÇÃO ---
        // Configura a data mínima como hoje
        const today = new Date().toISOString().split('T')[0];
        dateInput.min = today;

        // --- EVENTOS ---

        // 1. Seleção de Serviço
        servicesList.addEventListener('click', (e) => {
            const option = e.target.closest('.service-option');
            if (!option) return;

            // Remove seleção anterior
            document.querySelectorAll('.service-option').forEach(el => el.classList.remove('selected'));
            
            // Adiciona nova seleção
            option.classList.add('selected');
            selectedService = {
                name: option.dataset.service,
                price: option.dataset.price,
                duration: option.dataset.duration
            };
            
            checkFormCompletion();
        });

        // 2. Seleção de Data
        dateInput.addEventListener('change', (e) => {
            selectedDate = e.target.value;
            selectedTime = null; // Reseta horário ao mudar data
            generateTimeSlots(selectedDate);
            timeSection.style.display = 'block';
            checkFormCompletion();
        });

        // 3. Seleção de Horário (na Grid)
        timeGrid.addEventListener('click', (e) => {
            const option = e.target.closest('.time-option');
            if (!option || option.classList.contains('disabled')) return;

            // Remove seleção anterior
            document.querySelectorAll('.time-option').forEach(el => el.classList.remove('selected'));
            
            // Adiciona nova seleção
            option.classList.add('selected');
            selectedTime = option.dataset.time;
            
            checkFormCompletion();
        });

        // 4. Envio para WhatsApp
        submitBtn.addEventListener('click', () => {
            if (!selectedService || !selectedDate || !selectedTime) return;

            // Formata a data (DD/MM/AAAA)
            const dateObj = new Date(selectedDate + 'T00:00:00');
            const formattedDate = dateObj.toLocaleDateString('pt-BR');

            // Monta a mensagem
            const message = `Olá Dom Veiot! Gostaria de agendar um horário:\n\n` +
                            `✂️ *Serviço:* ${selectedService.name} (${selectedService.duration} - R$ ${selectedService.price})\n` +
                            `📅 *Data:* ${formattedDate}\n` +
                            `🕒 *Horário:* ${selectedTime}`;

            // Codifica a mensagem para a URL
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;

            // Abre o WhatsApp
            window.open(whatsappUrl, '_blank');
        });


        // --- FUNÇÕES AUXILIARES ---

        function generateTimeSlots(dateString) {
            timeGrid.innerHTML = ''; // Limpa grid

            const now = new Date();
            const selectedDateObj = new Date(dateString + 'T00:00:00');
            const isToday = selectedDateObj.toDateString() === now.toDateString();

            for (let hour = openingTime; hour < closingTime; hour++) {
                for (let minutes = 0; minutes < 60; minutes += timeSlotMinutes) {
                    
                    const timeLabel = `${String(hour).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                    
                    const slotDom = document.createElement('div');
                    slotDom.classList.add('time-option');
                    slotDom.dataset.time = timeLabel;
                    slotDom.textContent = timeLabel;

                    // Desabilita horários passados se for hoje
                    if (isToday) {
                        const slotTimeObj = new Date(dateString + 'T' + timeLabel + ':00');
                        if (slotTimeObj < now) {
                            slotDom.classList.add('disabled');
                        }
                    }

                    timeGrid.appendChild(slotDom);
                }
            }
        }

        function checkFormCompletion() {
            if (selectedService && selectedDate && selectedTime) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }
    </script>
</body>
</html>
